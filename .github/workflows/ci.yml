name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.8.6"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Quickstart on synthetic data
        run: |
          python make_synthetic.py
          python build_dataset.py --inputs data/sample/inputs.json.gz --output-dir data/sample
          python benchmark.py --dataset data/sample/evaluation_10to1.csv.gz --bootstrap 100
